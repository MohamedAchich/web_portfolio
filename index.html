<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio — Midnight Lime UI kit</title>
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="stylesheet" href="./styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="./_ds_bundle.js"></script>
<link rel="stylesheet" href="./responsive.css">
<style>body{margin:0;background:var(--canvas-dark)}#root{min-height:100vh}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./data.js"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./AboutSection.jsx"></script>
<script type="text/babel" src="./SkillsSection.jsx"></script>
<script type="text/babel" src="./ProjectsSection.jsx"></script>
<script type="text/babel" src="./BlogsSection.jsx"></script>
<script type="text/babel" src="./ContactSection.jsx"></script>
<script type="text/babel" src="./Portfolio.jsx"></script>
<script>window.addEventListener("load",()=>{setTimeout(()=>{const root=document.querySelector("#root > div");if(!root)return;const kids=[...root.children];kids.forEach((el,i)=>{el.classList.add("ml-reveal");el.style.transitionDelay=(i*60)+"ms"});const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("is-in");io.unobserve(e.target)}})},{rootMargin:"0px 0px -12% 0px"});kids.forEach(el=>io.observe(el))},400)})</script>
</body></html>
